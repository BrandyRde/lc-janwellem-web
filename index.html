            "@type": "Answer",
            "text": "Ja, in voller Höhe. Der Förderverein LC Düsseldorf-Jan-Wellem e.V. ist vom Finanzamt Düsseldorf als gemeinnützig anerkannt (VR 8147). Für Spenden bis 300 € gilt der vereinfachte Zuwendungsnachweis zusammen mit Ihrem Kontoauszug. Für höhere Beträge oder auf Wunsch stellen wir Ihnen selbstverständlich gerne eine offizielle Spendenbescheinigung aus."

          }
        },

          }
