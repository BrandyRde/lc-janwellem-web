  <text x="110" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#003366" letter-spacing="0.2">DÜSSELDORF-JAN-WELLEM</text>
  <text x="110" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C5A059" letter-spacing="2">WE SERVE • DISTRIKT 111</text>
</svg>
