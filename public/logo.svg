    <text x="45" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#C5A059" text-anchor="middle">L</text>
    <!-- Top & Bottom text curve/bars -->
    <path d="M 30 18 Q 45 14 60 18" stroke="#E5C378" stroke-width="2" fill="none"/>
    <path d="M 30 72 Q 45 76 60 72" stroke="#E5C378" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Text Label -->
