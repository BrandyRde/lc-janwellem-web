<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Lions Emblem -->
  <g transform="translate(10, 5)">
    <circle cx="45" cy="45" r="42" fill="#003366" stroke="#C5A059" stroke-width="3"/>
    <circle cx="45" cy="45" r="34" fill="#0B1B3D" stroke="#E5C378" stroke-width="1"/>
    <!-- Lions stylized profile marks -->
    <path d="M 28 45 C 24 38 28 30 38 28 C 34 33 34 40 38 45 Z" fill="#C5A059"/>
    <path d="M 62 45 C 66 38 62 30 52 28 C 56 33 56 40 52 45 Z" fill="#C5A059"/>
